name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners come from the repo variables CI_LINUX_RUNNER and CI_WINDOWS_RUNNER
# (the org's self-hosted cortex and ocelotl), falling back to GitHub-hosted
# images when unset. Self-hosted runners are provisioned once with
# scripts/linux-deps.sh and verify their tools on every job instead of
# installing them.

jobs:
  linux:
    name: ${{ matrix.preset }}
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang, linux-asan, linux-tsan]
    env:
      LLVM_ROOT: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v7
      - if: runner.environment == 'github-hosted'
        run: scripts/linux-deps.sh
      - if: runner.environment != 'github-hosted'
        run: scripts/linux-deps.sh --check
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.preset == 'linux-gcc' && 'g++' || 'clang++-22' }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows-msvc
    runs-on: ${{ vars.CI_WINDOWS_RUNNER || 'windows-2025' }}
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
      - if: runner.environment == 'github-hosted'
        run: choco install llvm ninja -y --no-progress
      # scripts\msvc.cmd enters the VS developer environment, the same way a
      # local build does.
      - run: scripts\msvc.cmd cmake --preset windows-msvc
      - run: scripts\msvc.cmd cmake --build --preset windows-msvc
      - run: scripts\msvc.cmd ctest --preset windows-msvc

  lint:
    runs-on: ${{ vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    env:
      LLVM_ROOT: /usr/lib/llvm-22
      CLANG_TIDY: clang-tidy-22
    steps:
      - uses: actions/checkout@v7
      - if: runner.environment == 'github-hosted'
        run: scripts/linux-deps.sh
      - if: runner.environment != 'github-hosted'
        run: scripts/linux-deps.sh --check
      - run: cmake --preset linux-clang -DCMAKE_CXX_COMPILER=clang++-22
      # A build, not just a configure: the fetched headers and the generated
      # version header must exist for clang-tidy to parse the sources.
      - run: cmake --build --preset linux-clang
      - run: scripts/lint.sh build/linux-clang
