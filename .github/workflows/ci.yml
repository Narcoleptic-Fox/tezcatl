name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [linux-gcc, linux-clang, linux-asan]
    env:
      LLVM_ROOT: /usr/lib/llvm-22
    steps:
      - uses: actions/checkout@v7
      - run: scripts/linux-deps.sh
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_CXX_COMPILER=${{ matrix.preset == 'linux-gcc' && 'g++' || 'clang++-22' }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  windows:
    name: windows-msvc
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM (libclang) and Ninja
        run: choco install llvm ninja -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset windows-msvc
      - run: cmake --build --preset windows-msvc
      - run: ctest --preset windows-msvc

  lint:
    runs-on: ubuntu-24.04
    env:
      LLVM_ROOT: /usr/lib/llvm-22
      CLANG_TIDY: clang-tidy-22
    steps:
      - uses: actions/checkout@v7
      - run: scripts/linux-deps.sh
      - run: cmake --preset linux-clang -DCMAKE_CXX_COMPILER=clang++-22
      # A build, not just a configure: the fetched headers and the generated
      # version header must exist for clang-tidy to parse the sources.
      - run: cmake --build --preset linux-clang
      - run: scripts/lint.sh build/linux-clang
